name: Build Standalone Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App Static Assets
        run: |
          # Generowanie tras TanStack Router
          npx @tanstack/router-cli generate || npx tsr generate || true

          # Budowanie plików statycznych aplikacji do folderu dist
          npm run build

      - name: Setup Standalone Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Konfiguracja Capacitora z Twoim identyfikatorem pakietu
          cat <<EOT > capacitor.config.json
          {
            "appId": "com.sopel93.volte",
            "appName": "VoLTE Optimizer",
            "webDir": "dist"
          }
          EOT

          npx cap init "VoLTE Optimizer" "com.sopel93.volte" --web-dir dist --yes || true

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volte-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

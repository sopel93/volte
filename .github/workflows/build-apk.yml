name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App & Locate Output
        run: |
          # 1. Generowanie ścieżek TanStack Router (jeśli istnieją)
          npx tsr generate || true

          # 2. Uruchomienie budowania projektu
          npm run build || npx vite build

          # 3. Automatyczne wyszukanie wygenerowanego pliku index.html (z wyłączeniem node_modules)
          INDEX_PATH=$(find . -not -path '*/node_modules/*' -not -path '*/.git*' -name "index.html" | head -n 1)

          if [ -z "$INDEX_PATH" ]; then
            echo "❌ BŁĄD: Proces budowania nie wygenerował pliku index.html w żadnym katalogu!"
            echo "Struktura katalogów po budowaniu:"
            find . -maxdepth 2 -not -path '*/node_modules/*' -not -path '*/.git*'
            exit 1
          fi

          # 4. Wyciągnięcie ścieżki do folderu produkcyjnego
          TARGET_DIR=$(dirname "$INDEX_PATH" | sed 's|^\./||')
          echo "✅ Znaleziono zbudowaną aplikację w katalogu: $TARGET_DIR"
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Setup Capacitor and Sync
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat <<EOT > capacitor.config.json
          {
            "appId": "com.volte.app",
            "appName": "Volte",
            "webDir": "${{ env.TARGET_DIR }}"
          }
          EOT

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volte-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor and Detect Web Dir
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Auto-wykrywanie folderu ze zbudowaną aplikacją
          WEB_DIR="dist"
          if [ -d "build" ]; then
            WEB_DIR="build"
          elif [ -d "out" ]; then
            WEB_DIR="out"
          fi

          echo "Wykryty folder produkcyjny: $WEB_DIR"

          # Tworzenie konfigu z właściwym folderem
          cat <<EOT > capacitor.config.json
          {
            "appId": "com.volte.app",
            "appName": "Volte",
            "webDir": "$WEB_DIR"
          }
          EOT

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volte-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

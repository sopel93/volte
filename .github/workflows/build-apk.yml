name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Dummy Web Directory & Config
        run: |
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><title>Volte</title></head><body></body></html>' > dist/index.html

          # Zamień poniższy URL na swój prawdziwy adres z Vercel!
          APP_URL="https://volte-rhwx2hcmu-ssopel.vercel.app"

          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat <<EOT > capacitor.config.json
          {
            "appId": "com.volte.app",
            "appName": "Volte",
            "webDir": "dist",
            "server": {
              "url": "$APP_URL",
              "cleartext": true
            }
          }
          EOT

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volte-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

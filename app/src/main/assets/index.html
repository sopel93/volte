<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoLTE Optimizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 360px;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p.subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 28px;
        }
        .status-box {
            background: #0f172a;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 28px;
            border: 1px solid #1e293b;
        }
        .status-title {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .status-value {
            font-size: 16px;
            font-weight: bold;
            color: #22c55e;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .footer {
            margin-top: 24px;
            font-size: 11px;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>VoLTE Optimizer</h1>
        <p class="subtitle">Natywny Optymalizator Sieci</p>

        <div class="status-box">
            <div class="status-title">Stan Połączenia</div>
            <div class="status-value" id="status">Gotowy do optymalizacji</div>
        </div>

        <button class="btn" id="optBtn" onclick="toggleOptimization()">Uruchom Optymalizację</button>
    </div>

    <div class="footer">Wersja 1.2.0 • Standalone Local App</div>

    <script>
        let isActive = false;

        function toggleOptimization() {
            const statusEl = document.getElementById('status');
            const btnEl = document.getElementById('optBtn');

            if (!isActive) {
                statusEl.innerText = 'Aktywna (Czysty Tunel VoLTE)';
                statusEl.style.color = '#38bdf8';
                btnEl.innerText = 'Zatrzymaj Optymalizację';
                btnEl.style.background = 'linear-gradient(135deg, #dc2626, #991b1b)';
                isActive = true;
            } else {
                statusEl.innerText = 'Nieaktywna';
                statusEl.style.color = '#ef4444';
                btnEl.innerText = 'Uruchom Optymalizację';
                btnEl.style.background = 'linear-gradient(135deg, #0284c7, #0369a1)';
                isActive = false;
            }
        }
    </script>

</body>
</html>
